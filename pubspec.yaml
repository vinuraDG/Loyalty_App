name: loyalty_app
description: A loyalty mobile application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local storage
  shared_preferences: ^2.3.2  # upgraded: 2.2.3 → 2.3.2 (built-in Kotlin support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR features
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  gap: ^3.0.1
  provider: ^6.1.5+1
  dio: ^5.9.2
  app_links: ^6.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#07041A"
  image: assets/images/logo.png
  android_12:
    color: "#07041A"
    image: assets/images/logo.png
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
