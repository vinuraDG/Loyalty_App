name: loyalty_app
description: A loyalty mobile application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local storage
  shared_preferences: ^2.3.2  # upgraded: 2.2.3 → 2.3.2 (built-in Kotlin support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR features
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.3      # upgraded: 5.2.3 → 6.0.3 (fixes KGP warning)

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  gap: ^3.0.1
  provider: ^6.1.5+1
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700